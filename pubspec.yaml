name: marg_sync_pro
description: Offline-first Barcode Billing & Marg ERP CSV Export App with Cloud Licensing.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  reactiv: ^1.1.0
  mobile_scanner: ^5.1.1
  share_plus: ^10.0.0
  services:
    path: packages/services
  domain:
    path: packages/domain
  graphics:
    path: packages/graphics

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - full_item_master.csv
    - clean_parties.csv
