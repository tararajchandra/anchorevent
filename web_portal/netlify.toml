[build]
  publish = "."
  command = "echo \"window.MARG_ENV = { SUPABASE_URL: '${SUPABASE_URL}', SUPABASE_ANON_KEY: '${SUPABASE_ANON_KEY}' };\" > env-config.js"

[build.environment]
  # Only the public Supabase URL + anon key are injected into the browser bundle.
  SECRETS_SCAN_OMIT_PATHS = "env-config.js"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"
